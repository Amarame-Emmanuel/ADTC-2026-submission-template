; Confine pytest to this project's own tests.
;
; Without this, a bare `pytest` from the repo root walks into profiler/ - the
; ADTC profiler is a separate GPL-v3 repository cloned locally for benchmarking
; (see .gitignore) and it vendors llama.cpp, which brings its own tests/
; directory. Two directories named `tests` with no __init__.py collide on
; module name and collection dies:
;
;   ModuleNotFoundError: No module named 'tests.test_safety'
;
; The failure looks like this project's tests are broken when nothing is wrong
; with them, and it appears only after someone clones the profiler - so it
; would surface for a judge reproducing the benchmarks, at the worst moment.
[pytest]
testpaths = tests
norecursedirs = profiler corpus index models submission* .venv
addopts = -q
